# httpd.conf(5): the server block of fuguoracle (DEPLOY-HTTPD). An
# operator puts the host name of the service in place of
# oracle.example.org.
#
# The block exposes the three endpoints of the service, and it blocks
# every other path (DEPLOY-HTTPD-1). acme-client(1) supplies the
# certificate and the key at the two paths (DEPLOY-HTTPD-2). The
# request body cap stops an oversized body at the front door
# (DEPLOY-HTTPD-3). Each endpoint goes to the slowcgi(8) socket of the
# fuguoracle rc.d script. httpd(8) reads the socket path inside its
# /var/www chroot.

server "oracle.example.org" {
	listen on egress tls port 443
	tls {
		certificate "/etc/ssl/oracle.example.org.fullchain.pem"
		key "/etc/ssl/private/oracle.example.org.key"
	}
	connection max request body 4096
	location "/get_pin" {
		fastcgi {
			socket "/run/fuguoracle.sock"
			param SCRIPT_FILENAME "/cgi-bin/fuguoracle"
		}
	}
	location "/set_pin" {
		fastcgi {
			socket "/run/fuguoracle.sock"
			param SCRIPT_FILENAME "/cgi-bin/fuguoracle"
		}
	}
	location "/" {
		fastcgi {
			socket "/run/fuguoracle.sock"
			param SCRIPT_FILENAME "/cgi-bin/fuguoracle"
		}
	}
	location match ".*" { block }
}
